# ================================================================
# THEWIZECOMPANY INVOICING APPLICATION — LOCAL DEVELOPMENT INFRASTRUCTURE
# ================================================================
# Starts PostgreSQL  locally for development.
# Run with: docker compose up -d
# Stop with: docker compose down
# ================================================================

services:

  # ── POSTGRESQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: billnova-postgres
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Data persists between docker compose down/up
      - billnova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USERNAME -d $$DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 5

