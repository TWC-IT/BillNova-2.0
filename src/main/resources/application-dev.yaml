# Local development overrides. Contains NO secrets — everything sensitive
# comes from environment variables / your untracked .env file.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BillnovaDevPool
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    # SQL is logged through org.hibernate.SQL below; leaving show-sql on would print it twice.
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,logfile

logging:
  level:
    com.thewizecompany.billnova: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
