spring:
  application:
    name: Billnova

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # JPA / HIBERNATE ----------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        #postgres dialect for proper database integration
        dialect: org.hibernate.dialect.PostgreSQLDialect
        #Batches insert/update for sql performance
        jdbc:
          batch_size: 25
        order_updates: true
        order_inserts: true
        #formats sql in logs
        format_sql: true
        # CRITICAL: Must be false in production.
        # open-in-view keeps database connection open for entire
        # HTTP request including view rendering — wastes connections.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    table: flyway_schema_history

  jackson:
#    serialization:
#      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

    default-property-inclusion: non_null
    time-zone: UTC

#  cache:
#    type: redis

  server:
    error:
      whitelabel:
        enabled: false
    port: ${SERVER_PORT:8080}
    servlet:
      context-path: /
    compression:
      enabled: true
      min-response-size: 2048
      mime-types:
        - application/json
        - text/plain
    shutdown: graceful
    tomcat:
      connection-timeout: 20s

# ── LOGGING ──────────────────────────────────────────────────
logging:
  file:
    name: logs/billnova.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/billnova-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # ADDED 'logfile' HERE
        include: health,info,metrics,prometheus,logfile
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  server:
    shutdown-timeout: 30s

# ── SPRINGDOC (Swagger UI) ───────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Groups operations by tag in the UI
    tags-sorter: alpha
    operations-sorter: method
    # Persists auth token in Swagger between page refreshes
    persist-authorization: true
  # Shows actuator endpoints in Swagger (useful for dev)
  show-actuator: false

app:
  timezone: "Asia/Kolkata"
  security:
    jwt:
      # Secrets come from environment variables only
      # Never hardcode secrets here
      access-token-secret: ${JWT_ACCESS_SECRET}
      refresh-token-secret: ${JWT_REFRESH_SECRET}
      # 15 minutes in milliseconds
      access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
      # 7 days in milliseconds
      refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    rate-limit:
      # Requests per minute per IP
      requests-per-minute: ${RATE_LIMIT_RPM:60}
      # Max login attempts before lockout
      max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
      # Max pin login attempts before lockout













